name: Release to PyPI

# Admin only, by hand: builds and checks the release, runs the CI suite (run-tests.yml) on the same commit unless it
# already passed on the same code, uploads it to PyPI by trusted publishing and then has release-docker.yml build the
# image from it. The upload job runs in the pypi environment, which PyPI's trusted publisher is bound to and whose
# required reviewers live in the repository settings.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; must equal the version in pyproject.toml
        type: string
        required: true
      dry_run:
        description: Build, check and test only, publish nothing
        type: boolean
        default: false
      docker:
        description: Registries to push the image to afterwards
        type: choice
        options: [ "both", "dockerhub", "ghcr", "none" ]
        default: both
      latest:
        description: Also tag the image latest (turn this off when releasing an older line)
        type: boolean
        default: true
      retest:
        description: Run the test suite even if it already passed on this code
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the earlier runs that may have tested this code
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
      tested_by: ${{ steps.tested.outputs.tested_by }}
    steps:
      - name: Require an admin
        # Here as well as in the publishing jobs, so a run nobody may publish from stops at once. $/ is the action at
        # the commit being run: no checkout needed, and no earlier step can replace it
        uses: $/.github/actions/require-admin

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          release='^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$'
          if ! [[ $VERSION =~ $release ]]; then
            echo "::error::The version must be a release version such as 2.2.0"
            exit 1
          fi
          project=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$project" != "$VERSION" ]; then
            echo "::error::pyproject.toml has version $project, not $VERSION: the wrong ref, or a version not bumped"
            exit 1
          fi
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 \
            "https://pypi.org/pypi/deepsecrets/$VERSION/json") || true
          case $status in
            404) echo "deepsecrets $VERSION is not on PyPI yet" ;;
            200)
              if [ "$DRY_RUN" = true ]; then
                echo "::warning::deepsecrets $VERSION is already on PyPI; a real run would fail at the upload"
              else
                echo "::error::deepsecrets $VERSION is already on PyPI"
                exit 1
              fi
              ;;
            *)
              echo "::error::Could not ask PyPI whether deepsecrets $VERSION exists (HTTP $status)"
              exit 1
              ;;
          esac

      - name: Look for a passing test run of this code
        # The suite needs one pass per tree, not per run. The tree covers every file, the workflows and poetry.lock
        # included, so a pass on the same tree ran the same tests on the same code: a push run of run-tests.yml, or an
        # earlier run of this workflow whose test jobs all passed. Pull-request runs test a merge with the base, not
        # their head commit, and do not count. Anything the lookup cannot answer runs the suite
        id: tested
        env:
          TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RETEST: ${{ inputs.retest }}
        run: |
          if [ "$RETEST" = true ]; then
            echo "retest is on, so the suite runs"
            exit 0
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          python - "$tree" <<'EOF'
          import json
          import os
          import sys
          import urllib.request

          tree = sys.argv[1]
          base = f'{os.environ["API_URL"]}/repos/{os.environ["REPOSITORY"]}'


          def get(path):
              headers = {
                  'Authorization': f'Bearer {os.environ["TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              with urllib.request.urlopen(urllib.request.Request(f'{base}/{path}', headers=headers), timeout=30) as r:
                  return json.load(r)


          def same_tree(run):
              return (run.get('head_commit') or {}).get('tree_id') == tree


          def find():
              for run in get('actions/workflows/run-tests.yml/runs?event=push&status=success&per_page=100')['workflow_runs']:
                  if same_tree(run):
                      return run
              for run in get('actions/workflows/release-pypi.yml/runs?per_page=100')['workflow_runs']:
                  if run['id'] == int(os.environ['RUN_ID']) or not same_tree(run):
                      continue
                  jobs = get(f'actions/runs/{run["id"]}/jobs?per_page=100')['jobs']
                  tests = [job for job in jobs if job['name'].startswith('Tests / ')]
                  if tests and all(job['conclusion'] == 'success' for job in tests):
                      return run
              return None


          try:
              run = find()
          except Exception as error:
              print(f'::warning::Could not look for an earlier test run ({error}), so the suite runs')
              sys.exit(0)
          if run:
              print(f'::notice::The suite passed on this code (tree {tree}) in {run["html_url"]}; it does not run again')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  print(f'tested_by={run["html_url"]}', file=output)
          else:
              print(f'The suite has not passed on tree {tree} yet, so it runs')
          EOF

      - name: Build
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build

      - name: Check the files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python -m twine check --strict dist/*
          # pyproject.toml excludes the diagnostics package from builds; the tracer must never ship
          python - "dist/deepsecrets-$VERSION-py3-none-any.whl" <<'EOF'
          import sys
          import zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          leaked = [name for name in names if name.startswith('deepsecrets/diagnostics/')]
          if leaked:
              print(f'::error::The wheel contains deepsecrets/diagnostics/: {", ".join(leaked)}')
              sys.exit(1)
          EOF

      - name: Smoke-test the wheel
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --no-cache-dir "dist/deepsecrets-$VERSION-py3-none-any.whl"
          # From outside the checkout, so nothing can import the source tree in place of the installed wheel
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/deepsecrets" --target-dir "$GITHUB_WORKSPACE/tests/fixtures" \
            --outfile "$RUNNER_TEMP/smoke.sarif" --outformat sarif
          # The SARIF version comes from SCANNER_VERSION in deepsecrets/config.py. At least one result, never a count:
          # the count depends on where the fixtures sit
          python - "$RUNNER_TEMP/smoke.sarif" <<'EOF'
          import json
          import os
          import sys

          expected = os.environ['VERSION']
          with open(sys.argv[1]) as report:
              run = json.load(report)['runs'][0]
          version = run['tool']['driver'].get('semanticVersion')
          results = len(run.get('results') or [])
          print(f'deepsecrets {version} found {results} secrets in tests/fixtures')
          if version != expected:
              print(f'::error::The scanner reports version {version}, not {expected}: was SCANNER_VERSION bumped?')
              sys.exit(1)
          if results < 1:
              print('::error::The installed wheel found nothing in tests/fixtures')
              sys.exit(1)
          EOF

      - name: Hash the files
        id: digests
        run: |
          # Every file under dist/, in a fixed order; the publish job recomputes this with the same command
          digests=$(cd dist && find . -type f -printf '%P\n' | LC_ALL=C sort | xargs -r -d '\n' sha256sum --)
          echo "$digests"
          {
            echo "digests<<EOF"
            echo "$digests"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  tests:
    # The release's test gate: every Python the matrix covers must pass before anything is published, in this run or,
    # on the same code, in an earlier one (the build job's tested_by). Later runs find these jobs by their "Tests / "
    # names, so keep the name
    name: Tests
    needs: build
    if: ${{ needs.build.outputs.tested_by == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/run-tests.yml

  publish:
    name: Publish to PyPI
    needs: [ build, tests ]
    # A skipped tests job would skip this one too, so the results are spelled out: the suite passed here, or it was
    # skipped because it had passed on this code before
    if: >-
      ${{ !cancelled() && !inputs.dry_run && needs.build.result == 'success' && (needs.tests.result == 'success' ||
      (needs.tests.result == 'skipped' && needs.build.outputs.tested_by != '')) }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing, and signing the PEP 740 attestations
    steps:
      - name: Require an admin
        uses: $/.github/actions/require-admin

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Check the files are the ones the build job hashed
        # Any job of this run can write artifacts, so the upload is only what the build job produced: same files, same
        # SHA-256, nothing extra
        env:
          DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          actual=$(cd dist && find . -type f -printf '%P\n' | LC_ALL=C sort | xargs -r -d '\n' sha256sum --)
          if [ "$actual" != "$DIGESTS" ]; then
            echo "::error::dist/ is not what the build job produced"
            diff <(echo "$DIGESTS") <(echo "$actual") || true
            exit 1
          fi
          echo "$actual"

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  docker:
    name: Docker image
    # After the upload the image installs from, so never in a dry run. The result is spelled out because a skipped tests
    # job upstream would otherwise skip this one
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && inputs.docker != 'none' }}
    permissions:
      contents: read
      packages: write # release-docker.yml pushes to GHCR with GITHUB_TOKEN
    uses: ./.github/workflows/release-docker.yml
    with:
      version: ${{ inputs.version }}
      latest: ${{ inputs.latest }}
      registry: ${{ inputs.docker }}
    # A called workflow gets only the secrets its caller passes, environment secrets included: unpassed, the token is
    # empty there even in the docker environment. Passed by name, it still resolves only in the job that runs in docker
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
